[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Ref2Act"
version = "0.2.1"
description = "Motion-tracking environments built on Isaac Lab."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium",
    "isaaclab",
    "matplotlib",
    "numpy",
    "torch",
]

[project.optional-dependencies]
sim2sim = [
    "mujoco",
    "mujoco-python-viewer",
]

[project.scripts]
ref2act-convert = "ref2act.cli.convert:main"
ref2act-convert-batch = "ref2act.cli.convert_batch:main"
ref2act-plot-anchor-diagnostics = "ref2act.cli.plot_anchor_diagnostics:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ref2act*"]

[tool.setuptools.package-data]
ref2act = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
